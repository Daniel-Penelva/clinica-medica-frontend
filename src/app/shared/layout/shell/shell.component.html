<div class="shell-container">
  <!-- Navbar no topo - recebe referencia ao sidenav -->
  <app-navbar (toggleSidenav)="toggleSidenav()" />

  <!-- Container principal: sidebar + conteudo -->
  <mat-sidenav-container class="sidenav-container">
    <!-- Sidebar lateral -->
    <mat-sidenav #sidenav mode="side" opened class="sidenav">
      <app-sidebar />
    </mat-sidenav>

    <!-- Conteudo da pagina ativa -->
    <mat-sidenav-content class="main-content">

      <!-- Wrapper que empurra o rodape para baixo -->
      <div class="content-wrapper">
        <router-outlet />
      </div>

      <!-- Rodape Sempre no Final -->
      <footer class="footer">
        <span>Sistema de Gestao de Clinica Medica</span>
        <span class="separador">|</span>
        <span>© 2026 Copyright: Daniel Penelva de Andrade</span>
        <span class="separador">|</span>
        <span>Todos os direitos reservados</span>
        <span class="separador">|</span>
        <span>v1.0.0</span>
      </footer>

    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
